# Reconstructed media stack for liedelpi (2026-08-13).
# Original compose/media-stack/docker-compose.yml was lost; rebuilt from
# the Portainer snapshot (images + ports) and existing data dirs.
# Configs live in ~/Data/docker/data/*, library in ~/media/media/.
# Verify paths in the arr/jellyfin UIs after first boot.

name: media-stack

networks:
  media-net:
    external: true

services:
  jellyfin:
    image: jellyfin/jellyfin@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    restart: unless-stopped
    networks:
      media-net:
        ipv4_address: 172.18.0.14
    ports:
      - "192.168.1.138:8096:8096"
      - "192.168.1.138:1900:1900/udp"
      - "192.168.1.138:7359:7359/udp"
    environment:
      - TZ=Europe/Brussels
    volumes:
      - /home/juan/Data/docker/data/jellyfin/config:/config
      - /home/juan/media/movies:/data/movies:ro
      - /home/juan/media/series:/data/series:ro
      - /etc/localtime:/etc/localtime:ro

  qbittorrent:
    image: linuxserver/qbittorrent@sha256:212b86dff59e3962b4082b5ef20a577e76c8f8527d2ab505cfa887b4bcecb0b0
    container_name: qbittorrent
    restart: unless-stopped
    networks:
      media-net:
        ipv4_address: 172.18.0.5
    ports:
      - "192.168.1.138:8082:8080"
      - "0.0.0.0:6881:6881"
      - "0.0.0.0:6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
      - WEBUI_PORT=8080
    volumes:
      - /home/juan/Data/docker/data/qbittorrent/config:/config
      - /home/juan/media/downloads:/downloads
      - /home/juan/media:/data/media

  sonarr:
    image: linuxserver/sonarr@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
    container_name: sonarr
    restart: unless-stopped
    networks:
      media-net:
        ipv4_address: 172.18.0.11
    ports:
      - "192.168.1.138:8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - /home/juan/Data/docker/data/arr-stack/sonarr:/config
      - /home/juan/media/downloads:/downloads
      - /home/juan/media/series:/tv
      - /home/juan/media:/data/media

  radarr:
    image: linuxserver/radarr@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    container_name: radarr
    restart: unless-stopped
    networks:
      media-net:
        ipv4_address: 172.18.0.13
    ports:
      - "192.168.1.138:7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - /home/juan/Data/docker/data/arr-stack/radarr:/config
      - /home/juan/media/downloads:/downloads
      - /home/juan/media/movies:/movies
      - /home/juan/media:/data/media

  prowlarr:
    image: linuxserver/prowlarr@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    container_name: prowlarr
    restart: unless-stopped
    networks:
      media-net:
        ipv4_address: 172.18.0.10
    ports:
      - "192.168.1.138:9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - /home/juan/Data/docker/data/arr-stack/prowlarr:/config

  jellyseerr:
    image: fallenbagel/jellyseerr@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
    container_name: jellyseerr
    restart: unless-stopped
    networks:
      media-net:
        ipv4_address: 172.18.0.12
    ports:
      - "192.168.1.138:5055:5055"
    environment:
      - TZ=Europe/Brussels
    volumes:
      - /home/juan/Data/docker/data/jellyfin/jellyseer/config:/app/config

  whisparr:
    image: ghcr.io/hotio/whisparr@sha256:78b6370bd9a2c6ad2a96302f42dbcd457c4848ff85e7bba9e50b235434260da4
    container_name: whisparr
    restart: unless-stopped
    networks: [media-net]
    ports:
      - "192.168.1.138:6969:6969"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - /home/juan/Data/docker/data/whisparr/config:/config
      - /home/juan/media/downloads:/downloads
      - /home/juan/media:/data/media

  stash:
    image: stashapp/stash@sha256:df744af5a0c976e2ec671052ecc1f8a9aa757fa12b8f9930b59910b7295f0da6
    container_name: stash
    restart: unless-stopped
    networks: [media-net]
    ports:
      - "192.168.1.138:9999:9999"
    environment:
      - TZ=Europe/Brussels
    volumes:
      - /home/juan/Data/docker/data/stash:/root/.stash
      - /home/juan/media/stash:/data
