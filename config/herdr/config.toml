onboarding = false

[theme]
name = "tokyo-night"

[ui.sound]
enabled = false

# ── Layout ─────────────────────────────────────────────────────────────────────

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# ── Sidebar agent rows ──────────────────────────────────────────────────────────

[ui.sidebar.agents.rows_by_agent]
# pi-ask-herdr reports the pending ask_user question as `ask`/`ask_count` pane
# metadata tokens. The `$ask` row collapses while no question is pending, and
# Herdr truncates the question responsively while preserving the `+N` count.
pi = [
    ["state_icon", "workspace", "tab"],
    ["$ask", "$ask_count"],
    ["agent"],
]

# ── New workspace/agent keybindings ────────────────────────────────────────────

[keys]
# Workspace navigation (tmux-like)
previous_workspace = "prefix+,"
next_workspace = "prefix+."
switch_workspace = "prefix+shift+1..9"
last_pane = "prefix+;"

# Agent navigation
previous_agent = "prefix+shift+up"
next_agent = "prefix+shift+down"
focus_agent = "prefix+alt+1..9"

# Worktree management
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+d"

# ── herdr-plus: projects ──────────────────────────────────────────────────────

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

# ── herdr-todo: prompt backlog ─────────────────────────────────────────────────

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "rohanthewiz.herdr-todo.todo"
description = "herdr-todo: prompts"

# ── herdr-file-viewer ─────────────────────────────────────────────────────────

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[ui.toast]
delivery = "terminal"

[experimental]
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
kitty_graphics = true
pane_history = false

# BEGIN jhochenbaum.hunkdiff — managed by `setup-keys`; edit via the plugin, not by hand
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

# END jhochenbaum.hunkdiff

# ── annotate: text annotations ────────────────────────────────────────────────

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# ── annotate: document and agent-reply review ────────────────────────────────
# prefix+shift+o is reserved for opening worktrees above, so use prefix+shift+l
# for the last agent reply.
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"
