# Shared non-secret shell defaults. Deployed by home/common.nix to
# ~/.config/environment.d/10-dotfiles.conf, where systemd loads it for user
# sessions on Linux and both shells parse it directly on hosts without
# systemd (macOS). Single source of truth — do not duplicate these in
# config/nushell/env.nu, config/fish/config.fish, or home/*.nix.
#
# Constraint: bare KEY=value lines only — no quotes, no $VAR expansion.
# Both shell loaders take values literally, while systemd would strip
# quotes and expand variables. Anything with spaces/quotes (FZF_*,
# MANPAGER) or $HOME-derived paths (PI_*, PYTHONPYCACHEPREFIX) stays in
# the shells; host-specific paths stay in home/*.nix sessionVariables.
LANG=en_US.UTF-8
EDITOR=nvim
VISUAL=nvim
PAGER=less
MISE_LOG_LEVEL=error
LLAMA_BASE_URL=http://127.0.0.1:8000
MEMORYFIELD_EMBED_PROVIDER=llama-server
MEMORYFIELD_EMBED_URL=http://framearch-juan.bonobo-fort.ts.net:8001/v1/embeddings
MEMORYFIELD_EMBED_MODEL=nomic-embed-text-v1.5
MEMORYFIELD_MODEL_CODE=nomic-embed-text-v1.5
