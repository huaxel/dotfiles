# OmniWM settings — declarative muscle-memory config (sway/aerospace parity).
#
# Schema: version 4, matching nixpkgs `omniwm` 0.7.6 (locked flake input).
# Do NOT add v5-only keys (island, windowSwitcher, keyboardModes,
# general.workspaceAutoBackAndForth) until nixpkgs moves past 0.7.6.
#
# Hotkey IDs were verified against the 0.7.6 binary + upstream v0.7.6 tag
# sources (ActionCatalog+*.swift). Two spellings coexist there:
# camelCase for most actions, kebab-case for a few (toggle-overview).
# Every action may appear at most once; an omitted action is unassigned
# (NOT default) — so this file lists every binding we want, and nothing else.
# An unknown/duplicate id rejects the WHOLE file (OmniWM keeps running with
# previous settings and reports it under Settings > Troubleshooting).
# After first launch, validate there: any reported id is a one-line fix here.
#
# Layout: Niri everywhere (defaultLayoutType + all workspaces).
# Gaps mirror aerospace: inner 10, outer 10, top 40 (menu-bar clearance).
# Border mirrors aerospace: 6pt rose (#bb9af7), dark mode default.

schemaVersion = 4

[general]
hotkeysEnabled = true
systemHyperTrigger = "None"
hyperKeyModifiers = "Control+Option+Shift+Command"
defaultLayoutType = "niri"
preventSleepEnabled = false
updateChecksEnabled = true
ipcEnabled = true
animationsEnabled = true
animationSpeed = 1.0

[focus]
followsMouse = true
edgeNavigationInterval = 1.5
raiseOnMouseFocus = false
lockModifier = "off"
moveMouseToFocusedWindow = false
followsWindowToMonitor = true
crossesMonitorAtEdge = false
moveCrossesMonitorAtEdge = false

[mouseWarp]
margin = 1
enabled = true
constrainToArrangement = false

[routing]
mode = "macOS"
arrangements = []

[gaps]
size = 10.0
fullscreenUsesOuterGaps = false
[gaps.outer]
left = 10.0
right = 10.0
top = 40.0
bottom = 10.0

[niri]
visibleContainerCount = 2
infiniteLoop = false
centerFocusedColumn = "never"
alwaysCenterSingleColumn = false
singleWindowFit = "fill"

[dwindle]
smartSplit = false
defaultSplitRatio = 1.0
splitWidthMultiplier = 1.0
singleWindowFit = "fill"
useGlobalGaps = true
moveToRootStable = true

[borders]
enabled = true
width = 6.0
[borders.color]
red = 0.7333
green = 0.6039
blue = 0.9686
alpha = 1.0

[overview]
enabled = true
zoom = 1.0
matchFocusBorder = true
invertScrollDirection = false
mouseScrollSpeed = 1.0
[overview.backdrop]
red = 0.05
green = 0.05
blue = 0.08
alpha = 1.0
[overview.windowBorders.normal]
red = 0.3
green = 0.3
blue = 0.35
alpha = 0.5
[overview.windowBorders.hovered]
red = 0.4
green = 0.6
blue = 1.0
alpha = 1.0
[overview.windowBorders.selected]
red = 0.3
green = 0.8
blue = 0.4
alpha = 1.0

[workspaceBar]
enabled = true
hoverPreviewsEnabled = true
notificationBadges = "off"
notificationBadgeRefreshIntervalSeconds = 5.0
showLabels = true
showFloatingWindows = false
windowLevel = "popup"
position = "overlappingMenuBar"
notchMode = "moveBelowMenuBar"
notchActiveZoneWidth = 180.0
fullWidth = false
fullWidthNotchMode = "rightOfNotch"
systemStatsButton = false
deduplicateAppIcons = false
hideEmptyWorkspaces = false
excludedBundleIDs = []
iconOverrides = {}
reserveLayoutSpace = false
autoHide = false
autoHideRevealDelayMilliseconds = 0.0
autoHideHideDelayMilliseconds = 0.0
revealModifier = "off"
revealHoldMilliseconds = 200.0
hideInNativeFullscreen = false
height = 24.0
backgroundOpacity = 0.1
transparentBackground = false
solidBlackBackground = false
showItemBackgrounds = true
showAccentHighlights = true
xOffset = 0.0
yOffset = 0.0

[gestures]
scrollEnabled = true
scrollSensitivity = 5.0
scrollModifierKey = "optionShift"
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
fingerCount = 3
invertDirection = true
trackpadScrollStyle = "snap"
workspaceSwipeEnabled = false
workspaceSwipeFingerCount = 3
workspaceSwipeAxis = "vertical"
overviewGestureEnabled = false
overviewGestureFingerCount = 4
windowMoveEnabled = false
windowMoveFingerCount = 4
windowResizeEnabled = false
windowResizeFingerCount = 3
windowGestureSensitivity = 1.0
resizePreviewStyle = "live"
dwindleGroupDragAcrossDisplays = "group"
adoptNativeResize = false

[statusBar]
showWorkspaceName = true
showAppNames = false
useWorkspaceId = false
showIcon = true

[hiddenBar]
enabled = true
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[clipboard]
historyEnabled = false
maxItems = 200
maxItemBytes = 8388608
maxTotalBytes = 67108864
ignoredTypes = []

[quakeTerminal]
enabled = true
position = "center"
widthPercent = 50.0
heightPercent = 50.0
animationDuration = 0.2
autoHide = false
opacity = 1.0
backgroundEffect = "standardBlur"
backgroundBlurRadius = 0
monitorMode = "focusedWindow"

[scratchpads]
labels = {}

[appearance]
mode = "dark"
tabRailAppIcons = false

