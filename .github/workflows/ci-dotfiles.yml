# ─────────────────────────────────────────────────────────
# Dotfiles CI — runs FREE on the home-lab self-hosted runner.
#
# No GitHub-hosted minutes and no per-repo runner to register: the
# ci-jit-dispatcher on acerpepe (infra/ci-dispatcher) already serves
# huaxel/dotfiles and mints one ephemeral runner per job from its own
# token file. Push, wait ~30s for the poll, watch it go green.
#
# macOS-only checks (macos defaults, Brewfile install, pwsh AST) are NOT in
# this workflow: no always-on mac runner exists (mac-juan sleeps). Run
# `just ci` on the Mac after touching macos/, config/Brewfile, or *.ps1.
# ─────────────────────────────────────────────────────────

name: ci-dotfiles

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-dotfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: gate (self-hosted linux)
    runs-on: [self-hosted, linux, x64, jit]
    timeout-minutes: 120
    env:
      CI: "true"
      # User-scoped global root: workers run with NoNewPrivileges, so no
      # sudo. pi-resolve-hook.mjs reads `npm root -g`, which honors this.
      NPM_CONFIG_PREFIX: /home/juan/.npm-global
      # Ephemeral workers run with HOME=isolated workdir (dispatcher hygiene),
      # so sops cannot find ~/.config/sops/age/keys.txt on its own. acerpepe-only.
      SOPS_AGE_KEY_FILE: /home/juan/.config/sops/age/keys.txt
    steps:
      - uses: actions/checkout@v4

      # test-pi-packages resolves agent internals (managed install is
      # gitignored, so fresh clones use the global agent). Pin matches
      # pi/agent/install/current-version on dev machines — bump together.
      # Fresh clones have no node_modules; workspaces resolve their bins
      # (tsc, …) locally. Lockfile-pinned, no audit/fund noise.
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pi agent
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      - name: Full local gate (strict — no silent skips)
        run: just ci
